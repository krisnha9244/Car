<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Car Racing</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
    }

    html, body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background-color: #0d0f12;
      font-family: 'Segoe UI', Roboto, -apple-system, BlinkMacSystemFont, sans-serif;
    }

    #gameContainer {
      position: relative;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
    }

    /* Background Canvas */
    #bgCanvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
      filter: saturate(130%) brightness(110%) contrast(120%);
      display: block;
    }

    /* Vertical Dull Effect Gradient Overlay */
    #gradientOverlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(to bottom, rgba(0, 0, 0, 0) 0%, rgba(0, 0, 0, 0.6) 100%);
      pointer-events: none;
      z-index: 2;
    }

    /* Moving Game Objects Container */
    #gameObjectContainer {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      pointer-events: none;
      z-index: 5;
    }

    /* 3D-lifted effect for all game object images */
    #gameObjectContainer img {
      position: absolute;
      top: 0;
      left: 0;
      will-change: transform;
      filter: drop-shadow(0px 10px 12px rgba(0, 0, 0, 0.65));
      pointer-events: none;
    }

    /* 3D Score Box */
    #scoreBox {
      position: absolute;
      top: 24px;
      left: 20px;
      padding: 10px 22px;
      background: rgba(15, 17, 24, 0.82);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border-radius: 14px;
      border-top: 2px solid rgba(255, 255, 255, 0.3);
      border-left: 1.5px solid rgba(255, 255, 255, 0.18);
      border-right: 2px solid rgba(0, 0, 0, 0.6);
      border-bottom: 3px solid rgba(0, 0, 0, 0.8);
      box-shadow: 0 12px 24px rgba(0, 0, 0, 0.7), inset 0 2px 3px rgba(255, 255, 255, 0.25);
      color: #ffffff;
      font-size: 22px;
      font-weight: 800;
      letter-spacing: 1px;
      text-shadow: 0 2px 4px rgba(0, 0, 0, 0.9);
      z-index: 10;
      display: none;
      align-items: center;
      gap: 10px;
    }

    #scoreBox .coin-icon {
      color: #ffd54f;
      font-size: 20px;
      text-shadow: 0 0 10px rgba(255, 213, 79, 0.8);
    }

    /* Onscreen Steering Controls */
    .control-btn {
      position: absolute;
      bottom: 28px;
      width: 76px;
      height: 76px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.22);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border: 2px solid rgba(255, 255, 255, 0.45);
      box-shadow: 0 10px 24px rgba(0, 0, 0, 0.5), inset 0 2px 4px rgba(255, 255, 255, 0.4);
      color: #ffffff;
      font-size: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 20;
      cursor: pointer;
      touch-action: none;
      transition: background 0.15s, transform 0.1s;
    }

    .control-btn:active, .control-btn.active {
      background: rgba(229, 57, 53, 0.75);
      border-color: rgba(255, 255, 255, 0.7);
      transform: scale(0.92);
      box-shadow: 0 4px 12px rgba(229, 57, 53, 0.6);
    }

    #leftBtn {
      left: 24px;
    }

    #rightBtn {
      right: 24px;
    }

    /* Menu Screen */
    #menuScreen {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 30;
      background: radial-gradient(circle at center, rgba(10, 14, 22, 0.4) 0%, rgba(5, 7, 12, 0.75) 100%);
    }

    .menu-title {
      font-size: clamp(38px, 9vw, 54px);
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 3px;
      color: #ffffff;
      text-shadow: 0 4px 16px rgba(0, 0, 0, 0.9), 0 0 30px rgba(229, 57, 53, 0.6);
      margin-bottom: 12px;
      text-align: center;
    }

    .menu-subtitle {
      font-size: clamp(14px, 3.5vw, 18px);
      font-weight: 600;
      letter-spacing: 4px;
      color: #ffca28;
      text-transform: uppercase;
      text-shadow: 0 2px 8px rgba(0, 0, 0, 0.8);
      margin-bottom: 48px;
    }

    /* Animated "Let's Start" Button */
    #startBtn {
      padding: 18px 48px;
      font-size: clamp(20px, 5vw, 26px);
      font-weight: 800;
      letter-spacing: 2px;
      color: #ffffff;
      background: linear-gradient(135deg, #e53935 0%, #b71c1c 100%);
      border: none;
      border-radius: 50px;
      cursor: pointer;
      outline: none;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.6), inset 0 2px 4px rgba(255, 255, 255, 0.35);
      animation: pulse 1.6s infinite ease-in-out;
      text-transform: uppercase;
      text-shadow: 0 2px 4px rgba(0, 0, 0, 0.4);
    }

    #startBtn:active {
      transform: scale(0.96);
    }

    @keyframes pulse {
      0% {
        transform: scale(1);
        box-shadow: 0 0 0 0 rgba(229, 57, 53, 0.75), 0 8px 24px rgba(0, 0, 0, 0.6);
      }
      50% {
        transform: scale(1.08);
        box-shadow: 0 0 0 20px rgba(229, 57, 53, 0), 0 14px 32px rgba(0, 0, 0, 0.75);
      }
      100% {
        transform: scale(1);
        box-shadow: 0 0 0 0 rgba(229, 57, 53, 0), 0 8px 24px rgba(0, 0, 0, 0.6);
      }
    }

    /* Game Over Overlay */
    #gameOverScreen {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: rgba(10, 5, 5, 0.82);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      z-index: 35;
    }

    .game-over-title {
      font-size: clamp(42px, 11vw, 62px);
      font-weight: 900;
      letter-spacing: 4px;
      color: #ff1744;
      text-shadow: 0 0 25px rgba(255, 23, 68, 0.8), 0 4px 16px rgba(0, 0, 0, 0.9);
      margin-bottom: 12px;
      text-transform: uppercase;
      animation: shake 0.4s ease-in-out;
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-8px); }
      40%, 80% { transform: translateX(8px); }
    }

    .game-over-sub {
      font-size: clamp(16px, 4.5vw, 22px);
      font-weight: 600;
      letter-spacing: 3px;
      color: #e0e0e0;
      text-shadow: 0 2px 6px rgba(0, 0, 0, 0.8);
      margin-top: 14px;
      animation: blink 1s infinite alternate;
    }

    @keyframes blink {
      0% { opacity: 0.4; }
      100% { opacity: 1; }
    }

    .final-score {
      font-size: 24px;
      font-weight: 700;
      color: #ffd54f;
      margin-top: 20px;
      letter-spacing: 1px;
    }
  </style>
</head>
<body>

  <div id="gameContainer">
    <!-- Background Canvas -->
    <canvas id="bgCanvas"></canvas>

    <!-- Vertical Dull Gradient Overlay -->
    <div id="gradientOverlay"></div>

    <!-- 3D Score Box -->
    <div id="scoreBox">
      <span class="coin-icon">★</span>
      <span>SCORE: <span id="scoreVal">0</span></span>
    </div>

    <!-- Moving Game Objects (Player, Obstacles, Coins) -->
    <div id="gameObjectContainer"></div>

    <!-- Left & Right Controls -->
    <div id="leftBtn" class="control-btn" aria-label="Steer Left">◀</div>
    <div id="rightBtn" class="control-btn" aria-label="Steer Right">▶</div>

    <!-- Main Menu State -->
    <div id="menuScreen">
      <h1 class="menu-title">Car Racing</h1>
      <div class="menu-subtitle">High-Speed Road Challenge</div>
      <button id="startBtn">Let's Start</button>
    </div>

    <!-- Game Over State -->
    <div id="gameOverScreen">
      <h2 class="game-over-title">GAME OVER</h2>
      <div class="final-score" id="finalScoreText">SCORE: 0</div>
      <div class="game-over-sub">Restarting...</div>
    </div>
  </div>

  <!-- Preloaded Audio Elements (No Base64, relative paths) -->
  <audio id="carSound" src="carsound.mp3" loop preload="auto"></audio>
  <audio id="carHitSound" src="carhit.mp3" preload="auto"></audio>
  <audio id="collectSound" src="collect.wav" preload="auto"></audio>

  <script>
    (function() {
      'use strict';

      // --- DOM Elements ---
      const bgCanvas = document.getElementById('bgCanvas');
      const ctx = bgCanvas.getContext('2d');
      const gameObjectContainer = document.getElementById('gameObjectContainer');
      const scoreBox = document.getElementById('scoreBox');
      const scoreVal = document.getElementById('scoreVal');
      const menuScreen = document.getElementById('menuScreen');
      const gameOverScreen = document.getElementById('gameOverScreen');
      const finalScoreText = document.getElementById('finalScoreText');
      const startBtn = document.getElementById('startBtn');
      const leftBtn = document.getElementById('leftBtn');
      const rightBtn = document.getElementById('rightBtn');

      const carSound = document.getElementById('carSound');
      const carHitSound = document.getElementById('carHitSound');
      const collectSound = document.getElementById('collectSound');

      // --- Game State Machine ---
      // States: 'menu', 'playing', 'gameOver'
      let gameState = 'menu';

      // --- Background Road Image ---
      const roadImg = new Image();
      roadImg.src = 'road.jpg';
      let roadScrollY = 0;
      const roadSpeed = 7.5;

      // --- Dimensions & Responsive Scaling ---
      let screenWidth = window.innerWidth;
      let screenHeight = window.innerHeight;
      let scale = screenWidth / 360;
      let leftBoundary = 115 * scale;
      let rightBoundary = 275 * scale;

      function resize() {
        screenWidth = window.innerWidth;
        screenHeight = window.innerHeight;
        bgCanvas.width = screenWidth;
        bgCanvas.height = screenHeight;
        scale = screenWidth / 360;
        leftBoundary = 115 * scale;
        rightBoundary = 275 * scale;

        if (player.img) {
          player.width = screenWidth * 0.25;
          player.height = player.width * 1.875;
          player.y = screenHeight - player.height - (75 * scale);
          player.img.style.width = player.width + 'px';
          player.img.style.height = player.height + 'px';
          clampPlayer();
        }
      }
      window.addEventListener('resize', resize);

      // --- Player Car ---
      const player = {
        x: 0,
        y: 0,
        width: 0,
        height: 0,
        speed: 7,
        img: null
      };

      function initPlayer() {
        if (!player.img) {
          player.img = document.createElement('img');
          player.img.src = 'player_car.png';
          player.img.style.zIndex = '4'; // Player car visually on top (z-index: 4)
          gameObjectContainer.appendChild(player.img);
        }
        player.width = screenWidth * 0.25;
        player.height = player.width * 1.875;
        player.x = (leftBoundary + rightBoundary - player.width) / 2;
        player.y = screenHeight - player.height - (75 * scale);
        player.img.style.width = player.width + 'px';
        player.img.style.height = player.height + 'px';
        player.img.style.display = 'block';
        updatePlayerTransform();
      }

      function clampPlayer() {
        const minX = leftBoundary;
        const maxX = rightBoundary - player.width;
        if (player.x < minX) player.x = minX;
        if (player.x > maxX) player.x = maxX;
      }

      function updatePlayerTransform() {
        if (player.img) {
          player.img.style.transform = `translate(${player.x}px, ${player.y}px)`;
        }
      }

      // --- Obstacle Cars ---
      // 4 different obstacle images
      const obstacleImages = ['obstacle1.png', 'obstacle2.png', 'obstacle3.png', 'obstacle4.png'];
      let obstacles = [];
      let obstacleSpawnTimer = 0;
      const obstacleSpawnInterval = 110; // frames between obstacle spawns

      function spawnObstacle() {
        const obsImg = document.createElement('img');
        const randImg = obstacleImages[Math.floor(Math.random() * obstacleImages.length)];
        obsImg.src = randImg;
        obsImg.style.zIndex = '3'; // Obstacle z-index: 3

        // Size: exactly 25% smaller than player's car
        const obsWidth = player.width * 0.75;
        const obsHeight = player.height * 0.75;
        obsImg.style.width = obsWidth + 'px';
        obsImg.style.height = obsHeight + 'px';

        // Spawning: only on the left-hand side, completely outside main road boundaries (left of leftBoundary)
        // Position obstacle so it moves down along the left shoulder/edge
        const minX = Math.max(0, leftBoundary - obsWidth * 1.3);
        const maxX = Math.max(minX, leftBoundary - obsWidth * 0.3);
        const obsX = minX + Math.random() * (maxX - minX);
        const obsY = -obsHeight - 20;

        gameObjectContainer.appendChild(obsImg);

        obstacles.push({
          element: obsImg,
          x: obsX,
          y: obsY,
          width: obsWidth,
          height: obsHeight,
          speed: roadSpeed * (0.8 + Math.random() * 0.35)
        });
      }

      // --- Coins ---
      let coins = [];
      let coinSpawnTimer = 0;
      const coinSpawnInterval = 90; // frames between coin spawns

      function spawnCoin() {
        const coinImg = document.createElement('img');
        coinImg.src = 'coin.gif';
        coinImg.style.zIndex = '2'; // Coin z-index: 2

        // Size: 90x90 pixels
        const coinSize = Math.min(90, Math.max(60, 90 * scale));
        coinImg.style.width = coinSize + 'px';
        coinImg.style.height = coinSize + 'px';

        // Coins spawn randomly from top ONLY within the main road area
        const minX = leftBoundary + 6;
        const maxX = rightBoundary - coinSize - 6;
        const coinX = minX + Math.random() * Math.max(0, maxX - minX);
        const coinY = -coinSize - 10;

        gameObjectContainer.appendChild(coinImg);

        coins.push({
          element: coinImg,
          x: coinX,
          y: coinY,
          width: coinSize,
          height: coinSize,
          speed: roadSpeed
        });
      }

      // --- Score ---
      let score = 0;

      function updateScoreUI() {
        scoreVal.textContent = score;
      }

      // --- Audio Helpers ---
      function playSound(sound) {
        if (sound) {
          sound.currentTime = 0;
          sound.play().catch(function() {});
        }
      }

      // --- Controls & Input Handling ---
      let steerLeft = false;
      let steerRight = false;

      function handleControlStart(dir) {
        if (dir === 'left') {
          steerLeft = true;
          leftBtn.classList.add('active');
        } else if (dir === 'right') {
          steerRight = true;
          rightBtn.classList.add('active');
        }
      }

      function handleControlEnd(dir) {
        if (dir === 'left') {
          steerLeft = false;
          leftBtn.classList.remove('active');
        } else if (dir === 'right') {
          steerRight = false;
          rightBtn.classList.remove('active');
        }
      }

      // Touch & Pointer listeners
      leftBtn.addEventListener('touchstart', function(e) { e.preventDefault(); handleControlStart('left'); }, { passive: false });
      leftBtn.addEventListener('touchend', function(e) { e.preventDefault(); handleControlEnd('left'); }, { passive: false });
      leftBtn.addEventListener('touchcancel', function(e) { e.preventDefault(); handleControlEnd('left'); }, { passive: false });
      leftBtn.addEventListener('mousedown', function() { handleControlStart('left'); });
      leftBtn.addEventListener('mouseup', function() { handleControlEnd('left'); });
      leftBtn.addEventListener('mouseleave', function() { handleControlEnd('left'); });

      rightBtn.addEventListener('touchstart', function(e) { e.preventDefault(); handleControlStart('right'); }, { passive: false });
      rightBtn.addEventListener('touchend', function(e) { e.preventDefault(); handleControlEnd('right'); }, { passive: false });
      rightBtn.addEventListener('touchcancel', function(e) { e.preventDefault(); handleControlEnd('right'); }, { passive: false });
      rightBtn.addEventListener('mousedown', function() { handleControlStart('right'); });
      rightBtn.addEventListener('mouseup', function() { handleControlEnd('right'); });
      rightBtn.addEventListener('mouseleave', function() { handleControlEnd('right'); });

      // Keyboard support (Arrow keys & A/D)
      window.addEventListener('keydown', function(e) {
        if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') {
          steerLeft = true;
          leftBtn.classList.add('active');
        } else if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') {
          steerRight = true;
          rightBtn.classList.add('active');
        }
      });

      window.addEventListener('keyup', function(e) {
        if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') {
          steerLeft = false;
          leftBtn.classList.remove('active');
        } else if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') {
          steerRight = false;
          rightBtn.classList.remove('active');
        }
      });

      // --- Cleanup Dynamic Objects ---
      function clearDynamicObjects() {
        obstacles.forEach(function(obs) {
          if (obs.element && obs.element.parentNode) {
            obs.element.parentNode.removeChild(obs.element);
          }
        });
        obstacles = [];

        coins.forEach(function(c) {
          if (c.element && c.element.parentNode) {
            c.element.parentNode.removeChild(c.element);
          }
        });
        coins = [];

        obstacleSpawnTimer = 0;
        coinSpawnTimer = 0;
      }

      // --- State Transitions ---
      function goToMenu() {
        gameState = 'menu';
        menuScreen.style.display = 'flex';
        gameOverScreen.style.display = 'none';
        scoreBox.style.display = 'none';
        clearDynamicObjects();

        if (player.img) {
          player.img.style.display = 'none';
        }

        try {
          carSound.pause();
          carSound.currentTime = 0;
        } catch (e) {}
      }

      function startGame() {
        gameState = 'playing';
        menuScreen.style.display = 'none';
        gameOverScreen.style.display = 'none';
        scoreBox.style.display = 'flex';

        score = 0;
        updateScoreUI();
        clearDynamicObjects();
        initPlayer();

        // Continuous engine sound loops during gameplay
        try {
          carSound.currentTime = 0;
          carSound.play().catch(function() {});
        } catch (e) {}
      }

      function triggerGameOver() {
        if (gameState === 'gameOver') return;
        gameState = 'gameOver';

        // Sound: stops car engine sound, plays carhit.mp3 once
        try {
          carSound.pause();
          carSound.currentTime = 0;
        } catch (e) {}
        playSound(carHitSound);

        finalScoreText.textContent = `SCORE: ${score}`;
        gameOverScreen.style.display = 'flex';

        // After a 2-second delay, return to Main Menu
        setTimeout(function() {
          if (gameState === 'gameOver') {
            goToMenu();
          }
        }, 2000);
      }

      // Start button click
      startBtn.addEventListener('click', function() {
        startGame();
      });

      // --- Main Animation Loop ---
      function gameLoop() {
        requestAnimationFrame(gameLoop);

        // 1. Scroll Road Background (Both in menu and gameplay)
        roadScrollY = (roadScrollY + roadSpeed) % screenHeight;
        if (roadImg.complete && roadImg.naturalWidth > 0) {
          ctx.drawImage(roadImg, 0, roadScrollY - screenHeight, screenWidth, screenHeight);
          ctx.drawImage(roadImg, 0, roadScrollY, screenWidth, screenHeight);
        } else {
          // Fallback procedural asphalt if image is loading
          ctx.fillStyle = '#22262d';
          ctx.fillRect(0, 0, screenWidth, screenHeight);
        }

        // Only update game mechanics when playing
        if (gameState !== 'playing') {
          return;
        }

        // 2. Player Movement & Boundary Constraints
        const steerSpeed = player.speed * scale;
        if (steerLeft) {
          player.x -= steerSpeed;
        }
        if (steerRight) {
          player.x += steerSpeed;
        }
        clampPlayer();
        updatePlayerTransform();

        // 3. Spawn & Update Obstacles
        obstacleSpawnTimer++;
        if (obstacleSpawnTimer >= obstacleSpawnInterval) {
          spawnObstacle();
          obstacleSpawnTimer = 0;
        }

        for (let i = obstacles.length - 1; i >= 0; i--) {
          const obs = obstacles[i];
          obs.y += obs.speed;
          // Animate using CSS transform: translate(x, y)
          obs.element.style.transform = `translate(${obs.x}px, ${obs.y}px)`;

          // Rectangular collision detection for obstacles
          if (
            player.x < obs.x + obs.width &&
            player.x + player.width > obs.x &&
            player.y < obs.y + obs.height &&
            player.y + player.height > obs.y
          ) {
            triggerGameOver();
            return;
          }

          // Remove when offscreen
          if (obs.y > screenHeight + 50) {
            if (obs.element.parentNode) {
              obs.element.parentNode.removeChild(obs.element);
            }
            obstacles.splice(i, 1);
          }
        }

        // 4. Spawn & Update Coins
        coinSpawnTimer++;
        if (coinSpawnTimer >= coinSpawnInterval) {
          spawnCoin();
          coinSpawnTimer = 0;
        }

        const pCenterX = player.x + player.width / 2;
        const pCenterY = player.y + player.height / 2;

        for (let i = coins.length - 1; i >= 0; i--) {
          const coin = coins[i];
          coin.y += coin.speed;
          // Animate using CSS transform: translate(x, y)
          coin.element.style.transform = `translate(${coin.x}px, ${coin.y}px)`;

          // Strict Coin Collection: Center of player car passes over coin
          if (
            pCenterX >= coin.x &&
            pCenterX <= coin.x + coin.width &&
            pCenterY >= coin.y &&
            pCenterY <= coin.y + coin.height
          ) {
            playSound(collectSound);
            score += 5; // +5 points for coin collection
            updateScoreUI();

            if (coin.element.parentNode) {
              coin.element.parentNode.removeChild(coin.element);
            }
            coins.splice(i, 1);
            continue;
          }

          // Remove when offscreen
          if (coin.y > screenHeight + 50) {
            if (coin.element.parentNode) {
              coin.element.parentNode.removeChild(coin.element);
            }
            coins.splice(i, 1);
          }
        }
      }

      // Initialize
      resize();
      goToMenu();
      requestAnimationFrame(gameLoop);

    })();
  </script>
</body>
</html>
