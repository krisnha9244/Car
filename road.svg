<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1000" viewBox="0 0 720 1000">
  <defs>
    <linearGradient id="grassL" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1b4d1b"/>
      <stop offset="80%" stop-color="#2d6e2d"/>
      <stop offset="100%" stop-color="#1f521f"/>
    </linearGradient>
    <linearGradient id="asphalt" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1f2429"/>
      <stop offset="50%" stop-color="#2b313a"/>
      <stop offset="100%" stop-color="#1e2227"/>
    </linearGradient>
    <linearGradient id="shoulder" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#3a3e47"/>
      <stop offset="100%" stop-color="#2a2e35"/>
    </linearGradient>
    <pattern id="curbPattern" width="40" height="80" patternUnits="userSpaceOnUse">
      <rect x="0" y="0" width="40" height="40" fill="#e53935"/>
      <rect x="0" y="40" width="40" height="40" fill="#ffffff"/>
    </pattern>
  </defs>

  <!-- Left grass / shoulder (0 to 230, which corresponds to 0 to 115 on 360px) -->
  <rect x="0" y="0" width="120" height="1000" fill="url(#grassL)"/>
  <!-- Left paved shoulder where obstacles spawn -->
  <rect x="120" y="0" width="90" height="1000" fill="url(#shoulder)"/>
  <line x1="120" y1="0" x2="120" y2="1000" stroke="#555c69" stroke-width="4"/>
  <!-- Left Curb -->
  <rect x="210" y="0" width="20" height="1000" fill="url(#curbPattern)"/>

  <!-- Main Highway Asphalt (230 to 550, which corresponds to 115 to 275 on 360px) -->
  <rect x="230" y="0" width="320" height="1000" fill="url(#asphalt)"/>

  <!-- White solid edge lines -->
  <line x1="234" y1="0" x2="234" y2="1000" stroke="#ffffff" stroke-width="6"/>
  <line x1="546" y1="0" x2="546" y2="1000" stroke="#ffffff" stroke-width="6"/>

  <!-- Dashed center divider in main road: center is 390 (195 on 360px) -->
  <line x1="390" y1="0" x2="390" y2="1000" stroke="#ffd700" stroke-width="8" stroke-dasharray="70,55"/>

  <!-- Right Curb -->
  <rect x="550" y="0" width="20" height="1000" fill="url(#curbPattern)"/>
  <!-- Right shoulder / grass (570 to 720) -->
  <rect x="570" y="0" width="50" height="1000" fill="url(#shoulder)"/>
  <rect x="620" y="0" width="100" height="1000" fill="url(#grassL)"/>

  <!-- Guard rails -->
  <line x1="10" y1="0" x2="10" y2="1000" stroke="#90a4ae" stroke-width="8"/>
  <line x1="710" y1="0" x2="710" y2="1000" stroke="#90a4ae" stroke-width="8"/>
</svg>